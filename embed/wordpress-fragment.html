<!--
  L'Ancienne École — WordPress embed fragment
  ============================================
  Paste this into a WordPress "Custom HTML" block (or your theme's raw-HTML
  area) on the page that should host the booking module. It is
  self-contained: no other script or stylesheet needs to be added to
  WordPress for this to work.

  WHICH URL TO USE (pick the one matching the page's language):
    English : https://ancienne-ecole-troche.netlify.app/embed/reserve.html
    Français: https://ancienne-ecole-troche.netlify.app/embed/fr/reserve.html
    Nederlands: https://ancienne-ecole-troche.netlify.app/embed/nl/reserve.html
  The iframe below defaults to the English URL — change AE_EMBED_SRC to
  whichever language this WordPress page is in. The module's own language
  switch (EN/FR/NL, top-right inside the module) stays inside the iframe and
  keeps the guest's selected dates/party size when they switch.

  WHAT THIS DOES:
   - Renders a responsive <iframe> with no fixed height and no visible
     scrollbar — the calendar module inside posts its real content height to
     this page via postMessage, and the script below resizes the iframe to
     match, so there's never a double scrollbar or awkward clipped content.
   - Verifies both the message's origin (must be exactly the Netlify site
     below) and its shape (a small, specific object) before trusting it —
     see AE_EMBED_ORIGIN. Any other postMessage traffic on the page (from
     ads, other widgets, browser extensions, etc.) is ignored.
   - Payment is NEVER expected to happen inside this iframe: after a guest
     sends a request here, Aernoud approves it personally and a secure
     Stripe payment LINK is emailed to the guest directly — the guest opens
     that link in their own mail client/browser, completely outside
     WordPress and outside this iframe. There is nothing to configure here
     for that step; it's a structural property of how the module works, not
     something this fragment needs to handle. (Stripe's own checkout also
     refuses to render inside an iframe on other sites, so this is the only
     approach that would work regardless.)
-->

<div style="max-width: 1100px; margin: 0 auto;">
  <iframe
    id="ae-booking-iframe"
    title="L'Ancienne École — availability and booking request"
    src="https://ancienne-ecole-troche.netlify.app/embed/reserve.html"
    style="width: 100%; border: 0; display: block; overflow: hidden;"
    height="900"
    loading="lazy"
  ></iframe>
</div>

<script>
(function () {
  // Must match the embed pages' own origin exactly (scheme + host + port) —
  // this is the actual security boundary. Update this ONE line if the
  // booking module is ever moved to a different domain.
  var AE_EMBED_ORIGIN = "https://ancienne-ecole-troche.netlify.app";

  window.addEventListener("message", function (event) {
    if (event.origin !== AE_EMBED_ORIGIN) return; // wrong sender — ignore
    var data = event.data;
    if (!data || typeof data !== "object") return;
    if (data.aeSource !== "ae-booking-embed") return; // not our message shape — ignore
    if (typeof data.aeAncienneEcoleEmbedHeight !== "number") return;

    var iframe = document.getElementById("ae-booking-iframe");
    if (!iframe) return;
    // Also confirm the message actually came from THIS iframe (not some
    // other embed of the same module elsewhere on a busy page).
    if (event.source !== iframe.contentWindow) return;

    var h = Math.ceil(data.aeAncienneEcoleEmbedHeight);
    if (h > 0 && h < 20000) iframe.style.height = h + "px"; // sanity bound against a runaway/garbled value
  });
})();
</script>
