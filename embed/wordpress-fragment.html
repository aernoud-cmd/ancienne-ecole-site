<!--
  L'Ancienne École — WordPress embed fragment
  ============================================
  Paste this into a WordPress "Custom HTML" block (or your theme's raw-HTML
  area) on the page that should host the booking module. It is
  self-contained: no other script or stylesheet needs to be added to
  WordPress for this to work. The embedded module paints its own opaque
  dark background — the exact same dark palette used everywhere else on
  this site — rather than trying to blend transparently into whatever the
  surrounding WordPress page happens to be, so it always looks correct
  regardless of that page's own background color.

  PICK ONE BLOCK BELOW FOR THE LANGUAGE OF THIS PAGE and delete the other
  two — they're otherwise identical, only AE_EMBED_SRC (and the iframe's
  title, for screen readers) differs. The module's own language switch
  (EN/FR/NL, top-right inside the module) stays inside the iframe and keeps
  the guest's selected dates/party size when they switch — a French page
  visitor who switches to EN inside the module simply sees the module in
  English; the WordPress page around it is unaffected either way.

  WHAT THIS DOES:
   - Renders a responsive <iframe> with no fixed height and no visible
     scrollbar — the calendar module inside posts its real content height to
     this page via postMessage, and the script below resizes the iframe to
     match, so there's never a double scrollbar or awkward clipped content.
   - Verifies both the message's origin (must be exactly the Netlify site
     below) and its shape (a small, specific object) before trusting it —
     see AE_EMBED_ORIGIN. Any other postMessage traffic on the page (from
     ads, other widgets, browser extensions, etc.) is ignored. It also
     confirms the message actually came from THIS iframe specifically
     (event.source === the iframe's own contentWindow), not merely from the
     right origin — relevant if this fragment is ever pasted more than once
     on the same page.
   - Payment is NEVER expected to happen inside this iframe: once a guest
     fills in their dates and details here, they're taken straight to
     Stripe's own hosted Checkout page — a full-page redirect, completely
     outside WordPress and outside this iframe — and their booking is
     confirmed the instant that payment succeeds (no owner approval step in
     between any more). There is nothing to configure here for that step;
     it's a structural property of how the module works, not something this
     fragment needs to handle. (Stripe's own checkout also refuses to render
     inside an iframe on other sites, so this is the only approach that
     would work regardless.)
   - Tested at 360px, 390px, 656px (the observed real WordPress column
     width) and full desktop width: no horizontal overflow, no clipped
     buttons, no double scrollbar (see the project doc for the exact
     live-test notes).
-->

<!-- ==================== ENGLISH — use on an English-language page ==================== -->
<div style="max-width: 1100px; margin: 0 auto;">
  <iframe
    id="ae-booking-iframe"
    title="L'Ancienne École — availability and booking"
    src="https://ancienne-ecole-troche.netlify.app/embed/reserve.html"
    style="width: 100%; border: 0; display: block; overflow: hidden;"
    height="900"
    loading="lazy"
  ></iframe>
</div>

<!-- ==================== FRANÇAIS — use on a French-language page ====================
<div style="max-width: 1100px; margin: 0 auto;">
  <iframe
    id="ae-booking-iframe"
    title="L'Ancienne École — disponibilités et réservation"
    src="https://ancienne-ecole-troche.netlify.app/embed/fr/reserve.html"

==================================================================================== -->

<!-- ==================== NEDERLANDS — use on a Dutch-language page ====================
<div style="max-width: 1100px; margin: 0 auto;">
  <iframe
    id="ae-booking-iframe"
    title="L'Ancienne École — beschikbaarheid en boeking"
    src="https://ancienne-ecole-troche.netlify.app/embed/nl/reserve.html"
    style="width: 100%; border: 0; display: block; overflow: hidden;"
    height="900"
    loading="lazy"
  ></iframe>
</div>
==================================================================================== -->

<script>
(function () {
  // Must match the embed pages' own origin exactly (scheme + host + port) —
  // this is the actual security boundary. Update this ONE line if the
  // booking module is ever moved to a different domain (e.g. once
  // ancienne-ecole.rent itself points at the new site instead of WordPress).
  var AE_EMBED_ORIGIN = "https://ancienne-ecole-troche.netlify.app";

  window.addEventListener("message", function (event) {
    if (event.origin !== AE_EMBED_ORIGIN) return; // wrong sender — ignore
    var data = event.data;
    if (!data || typeof data !== "object") return;
    if (data.aeSource !== "ae-booking-embed") return; // not our message shape — ignore
    if (typeof data.aeAncienneEcoleEmbedHeight !== "number") return;

    var iframe = document.getElementById("ae-booking-iframe");
    if (!iframe) return;
    // Also confirm the message actually came from THIS iframe (not some
    // other embed of the same module elsewhere on a busy page).
    if (event.source !== iframe.contentWindow) return;

    var h = Math.ceil(data.aeAncienneEcoleEmbedHeight);
    if (h > 0 && h < 20000) iframe.style.height = h + "px"; // sanity bound against a runaway/garbled value
  });
})();
</script>
