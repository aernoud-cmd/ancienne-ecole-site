<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AE embed — responsive test harness (not linked, not for guests)</title>
<meta name="robots" content="noindex, nofollow">
<style>
  /*
    Internal QA page only — NOT part of the guest-facing site, not linked
    from anywhere, and safe to delete at any time. Reproduces the real
    WordPress embedding scenario (a cross-origin <iframe> at a FIXED pixel
    width, on a BLACK surrounding page — confirmed by the owner testing a
    real WordPress draft page on 2026-09-10, which is why this harness's
    own body is black too, not the light grey used before that finding).
    656px is the real observed WordPress column width and comes first;
    360/390/768/1100 stay below as regression checks at other widths.
  */
  body { font-family: -apple-system, "Work Sans", sans-serif; background: #000; margin: 0; padding: 24px; }
  .row { margin-bottom: 48px; }
  .label { font: 600 13px/1.4 monospace; margin-bottom: 8px; background: #c9a769; color: #1a1408; display: inline-block; padding: 4px 10px; border-radius: 3px; }
  .frame-wrap { border: 2px dashed #c0392b; box-sizing: content-box; background: #000; position: relative; }
  .frame-wrap::after { content: attr(data-w); position: absolute; top: -1px; right: -2px; background: #c0392b; color: #fff; font: 11px monospace; padding: 2px 6px; transform: translateY(-100%); }
  iframe { width: 100%; border: 0; display: block; overflow: hidden; background: transparent; }
</style>
</head>
<body>

<div class="row">
  <div class="label">656px — real WordPress column width, black page</div>
  <div class="frame-wrap" data-w="656px" style="width:656px;">
    <iframe id="f656" title="656px test" src="reserve.html" height="900"></iframe>
  </div>
</div>

<div class="row">
  <div class="label">360px — mobile (small)</div>
  <div class="frame-wrap" data-w="360px" style="width:360px;">
    <iframe id="f360" title="360px test" src="reserve.html" height="900"></iframe>
  </div>
</div>

<div class="row">
  <div class="label">390px — mobile (iPhone-class)</div>
  <div class="frame-wrap" data-w="390px" style="width:390px;">
    <iframe id="f390" title="390px test" src="reserve.html" height="900"></iframe>
  </div>
</div>

<div class="row">
  <div class="label">768px — tablet</div>
  <div class="frame-wrap" data-w="768px" style="width:768px;">
    <iframe id="f768" title="768px test" src="reserve.html" height="900"></iframe>
  </div>
</div>

<div class="row">
  <div class="label">1100px — desktop</div>
  <div class="frame-wrap" data-w="1100px" style="width:1100px;">
    <iframe id="f1100" title="1100px test" src="reserve.html" height="900"></iframe>
  </div>
</div>

<script>
// Same listener pattern as the real WordPress fragment (see
// embed/wordpress-fragment.html), extended to route each resize message to
// the one iframe it actually came from, since this test page embeds five.
(function () {
  var AE_EMBED_ORIGIN = window.location.origin;
  var ids = ["f656", "f360", "f390", "f768", "f1100"];
  window.addEventListener("message", function (event) {
    if (event.origin !== AE_EMBED_ORIGIN) return;
    var data = event.data;
    if (!data || typeof data !== "object") return;
    if (data.aeSource !== "ae-booking-embed") return;
    if (typeof data.aeAncienneEcoleEmbedHeight !== "number") return;
    for (var i = 0; i < ids.length; i++) {
      var iframe = document.getElementById(ids[i]);
      if (iframe && event.source === iframe.contentWindow) {
        var h = Math.ceil(data.aeAncienneEcoleEmbedHeight);
        if (h > 0 && h < 20000) iframe.style.height = h + "px";
        break;
      }
    }
  });
})();
</script>
</body>
</html>
