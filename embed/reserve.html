<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book your stay — L'Ancienne École</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/style.css">
<style>
  /* Embed-only overrides: no page chrome, just the booking module, sized to
     sit inside an <iframe> on another site (e.g. the existing WordPress site). */
  body { padding: 28px 20px 36px; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0; }
  .btn-primary { width: 100%; }
  @media (max-width: 860px) {
    .booking-cols { flex-direction: column; }
  }
</style>
</head>
<body>

<div class="wrap booking-cols" style="display: flex; gap: 56px; align-items: flex-start; flex-wrap: wrap;">
  <div style="flex: 1.3; min-width: 320px;">
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px;">
      <button type="button" class="btn-ghost" onclick="AE_BOOKING.prevMonth()" style="background:none;border:1px solid var(--line);color:var(--text);padding:8px 12px;border-radius:2px;cursor:pointer;">&larr;</button>
      <h2 id="ae-cal-month-label" style="font-size: 26px;">&nbsp;</h2>
      <button type="button" class="btn-ghost" onclick="AE_BOOKING.nextMonth()" style="background:none;border:1px solid var(--line);color:var(--text);padding:8px 12px;border-radius:2px;cursor:pointer;">&rarr;</button>
    </div>

    <div style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 10px;">
      <div style="text-align:center; font-size:11px; letter-spacing:1px; color: var(--text-dim);">MON</div>
      <div style="text-align:center; font-size:11px; letter-spacing:1px; color: var(--text-dim);">TUE</div>
      <div style="text-align:center; font-size:11px; letter-spacing:1px; color: var(--text-dim);">WED</div>
      <div style="text-align:center; font-size:11px; letter-spacing:1px; color: var(--text-dim);">THU</div>
      <div style="text-align:center; font-size:11px; letter-spacing:1px; color: var(--text-dim);">FRI</div>
      <div style="text-align:center; font-size:11px; letter-spacing:1px; color: var(--text-dim);">SAT</div>
      <div style="text-align:center; font-size:11px; letter-spacing:1px; color: var(--text-dim);">SUN</div>
    </div>

    <div id="ae-cal-days" style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px;">
    </div>

    <div style="display: flex; gap: 24px; margin-top: 28px; flex-wrap: wrap;">
      <div style="display:flex; align-items:center; gap: 8px;"><span style="width:13px;height:13px;background:var(--gold);border-radius:2px;display:inline-block;"></span><span style="font-size: 13px; color: var(--text-dim);">Your selected dates</span></div>
      <div style="display:flex; align-items:center; gap: 8px;"><span style="width:13px;height:13px;background:var(--bg-panel2);border-radius:2px;display:inline-block;"></span><span style="font-size: 13px; color: var(--text-dim);">Booked (per our Airbnb calendar)</span></div>
      <div style="display:flex; align-items:center; gap: 8px;"><span style="width:13px;height:13px;border:1px dashed var(--gold-soft);border-radius:2px;display:inline-block;"></span><span style="font-size: 13px; color: var(--text-dim);">Requested (awaiting confirmation)</span></div>
      <div style="display:flex; align-items:center; gap: 8px;"><span style="width:13px;height:13px;border:1px solid var(--line);border-radius:2px;display:inline-block;"></span><span style="font-size: 13px; color: var(--text-dim);">Available</span></div>
      <div style="display:flex; align-items:center; gap: 8px;"><span style="width:13px;height:13px;border:1px dashed var(--line);border-radius:2px;display:inline-block;opacity:0.7;"></span><span style="font-size: 13px; color: var(--text-dim);">Not yet open for booking (no price set)</span></div>
    </div>
    <div id="ae-cal-nights" style="margin-top: 14px; font-size: 13px; color: var(--text-dim);">&nbsp;</div>
    <div id="ae-cal-minstay-note" role="note" style="margin-top: 6px; font-size: 12.5px; color: var(--text-dim);"></div>
  </div>

  <form id="ae-booking-form" style="flex: 1; min-width: 300px; background: var(--bg-panel); border: 1px solid var(--line); padding: 40px; border-radius: 2px;" onsubmit="return AE_BOOKING.submit(event)">
    <h3 style="font-size: 24px; margin-bottom: 28px;">Your stay</h3>

    <div class="form-grid-2" style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px;">
      <div class="field">
        <label for="checkin">Check-in</label>
        <input class="input" type="text" id="checkin" name="checkin" readonly style="font-family: 'Work Sans', sans-serif;">
      </div>
      <div class="field">
        <label for="checkout">Check-out</label>
        <input class="input" type="text" id="checkout" name="checkout" readonly style="font-family: 'Work Sans', sans-serif;">
      </div>
    </div>

    <div class="form-grid-2" style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px;">
      <div class="field">
        <label for="adults">Adults</label>
        <select class="input" id="adults" name="adults" style="font-family: 'Work Sans', sans-serif;">
          <option>1</option><option>2</option><option>3</option><option selected>4</option><option>5</option><option>6</option><option>7</option><option>8</option>
        </select>
      </div>
      <div class="field">
        <label for="children">Children</label>
        <select class="input" id="children" name="children" style="font-family: 'Work Sans', sans-serif;">
          <option selected>0</option><option>1</option><option>2</option>
        </select>
      </div>
    </div>

    <div class="form-grid-2" style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px;">
      <div class="field">
        <label for="guest-name">Full name</label>
        <input class="input" type="text" id="guest-name" name="guest-name" required style="font-family: 'Work Sans', sans-serif;">
      </div>
      <div class="field">
        <label for="guest-email">Email</label>
        <input class="input" type="email" id="guest-email" name="guest-email" required style="font-family: 'Work Sans', sans-serif;">
      </div>
    </div>

    <div class="field" style="margin-bottom: 16px;">
      <label for="guest-phone">Phone / WhatsApp (optional)</label>
      <input class="input" type="tel" id="guest-phone" name="guest-phone" style="font-family: 'Work Sans', sans-serif;">
    </div>

    <div class="field" style="margin-bottom: 22px;">
      <label for="guest-message">Anything we should know? (optional)</label>
      <textarea class="input" id="guest-message" name="guest-message" rows="3" style="font-family: 'Work Sans', sans-serif; resize: vertical;"></textarea>
    </div>

    <div id="ae-price-breakdown" style="padding: 18px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); margin-bottom: 22px; transition: opacity 0.15s;">
    </div>

    <button class="btn-primary" type="submit" id="ae-booking-submit">Send booking request</button>
    <div id="ae-booking-status" style="text-align: center; font-size: 13px; margin-top: 14px; min-height: 18px;"></div>
    <div style="text-align: center; font-size: 12px; color: var(--text-dim); margin-top: 10px;">No payment now &mdash; Aernoud reviews every request personally and confirms within 24h, with a secure payment link.</div>
  </form>
</div>

<script src="../assets/app.js"></script>
<script src="../assets/booking.js"></script>
<script>AE_BOOKING.init('en');</script>
<script>
  // Tells the parent page how tall we are, so a listening embed script (see
  // README) can resize the <iframe> and avoid a double scrollbar. Safe to
  // ignore if the parent isn't listening — the iframe just keeps a fixed
  // height set in its own HTML instead (also documented in the README).
  (function () {
    function reportHeight() {
      var h = document.documentElement.scrollHeight;
      window.parent.postMessage({ aeAncienneEcoleEmbedHeight: h }, "*");
    }
    new MutationObserver(reportHeight).observe(document.body, { childList: true, subtree: true, attributes: true });
    window.addEventListener("load", reportHeight);
    window.addEventListener("resize", reportHeight);
    setTimeout(reportHeight, 300);
    setTimeout(reportHeight, 1000);
  })();
</script>
</body>
</html>
